<!doctype html>
<html><head><meta charset="utf-8"><title>Ring Hunter</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#0B1426;color-scheme:dark;overflow:hidden;font-family:"Public Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#EEF2F8}
#st{position:absolute;left:0;top:0;width:1600px;height:640px;transform-origin:0 0;display:flex;gap:24px}
.cap{flex:0 0 560px;box-sizing:border-box;background:#0E1A2F;border:1px solid #24365A;border-radius:18px;padding:26px 30px;display:flex;flex-direction:column;gap:14px}
.chip{align-self:flex-start;font:600 20px/1 "Fira Code",Consolas,Menlo,monospace;letter-spacing:2px;color:#0B1426;background:#5EEAD4;border-radius:999px;padding:8px 14px}
.chip.bad{background:#F16667}
#t{font-size:29px;font-weight:700;line-height:1.2}
#x{font-size:21px;line-height:1.45;color:#BFCBDD}
#s{font-size:34px;font-weight:800;color:#5EEAD4;line-height:1.15}
#s.bad{color:#F16667}
#c{font:400 17px/1.5 "Fira Code",Consolas,Menlo,monospace;color:#EEF2F8;background:#0B1426;border:1px solid #1E2F50;border-radius:10px;padding:10px 14px;white-space:pre}
#c:empty{display:none}
table{border-collapse:collapse;font-size:18px;width:100%}
th{font:500 14px "Fira Code",Consolas,monospace;color:#A9B4C8;text-align:left;padding:3px 6px;border-bottom:1px solid #24365A}
td{padding:4px 6px;border-bottom:1px solid #1B2A47;font-variant-numeric:tabular-nums}
td.n{text-align:right;font-family:"Fira Code",Consolas,monospace}
tr.top td{color:#F16667;font-weight:700}
.lg{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:16px;color:#A9B4C8}
.lg i{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.fade{transition:opacity .3s}.out{opacity:0}
.gp{flex:1;position:relative;border-radius:18px;border:1px solid #1B2A47;background:radial-gradient(circle at 50% 45%,#13264A 0%,#0B1426 72%)}
.gp svg{position:absolute;left:0;top:0;width:100%;height:100%}
.e path{stroke:#56637A;stroke-width:2.5;fill:none;transition:stroke .3s}
.e rect{fill:#0E1A2F;stroke:#2E4470}
.e text{fill:#F79767;font-size:12px;font-family:"Fira Code",Consolas,monospace}
.e text.sub{fill:#A9B4C8;font-size:11px}
.e.hot path{stroke:#F16667;stroke-width:4}
.e.hot rect{stroke:#F16667}
.e.hl path{stroke:#5EEAD4;stroke-width:4}
.e.hl rect{stroke:#5EEAD4}
.e.amb path{stroke:#FFC454;stroke-width:4}
.e.amb rect{stroke:#FFC454}
.e,.n{transition:opacity .35s}
.dim{opacity:.18}
.hide{display:none}
.n circle.b{stroke:rgba(0,0,0,.35);stroke-width:2;transition:stroke .3s}
.n text{font-size:13px;font-weight:700;fill:#0B1426}
.n.hot circle.b{stroke:#F16667;stroke-width:6}
.n.hl circle.b{stroke:#5EEAD4;stroke-width:6}
.n.amb circle.b{stroke:#FFC454;stroke-width:6}
.bd{display:none}.bd.on{display:inline}
.bd circle{fill:#F16667;stroke:#0B1426;stroke-width:2}.bd.ok circle{fill:#5EEAD4}
.bd text{font-size:14px;font-weight:800;fill:#0B1426}
.tg{display:none}.tg.on{display:inline}
.tg rect{fill:#0B1426;stroke:#5EEAD4;stroke-width:1.5}.tg text{fill:#5EEAD4;font-size:13px;font-weight:700;font-family:"Fira Code",Consolas,monospace}
.tg.bad rect{stroke:#F16667}.tg.bad text{fill:#F16667}
</style></head>
<body><div id="st"><div class="cap"><span class="chip" id="chip">STEP 1</span><div id="t" class="fade"></div><div id="x" class="fade"></div><div id="s" class="fade"></div><div id="c" class="fade"></div><div id="z" class="fade"></div><div class="lg"><span><i style="background:#4C8EDA"></i>Account</span><span><i style="background:#FFC454"></i>Loop</span><span><i style="background:#F16667"></i>Fraud ring</span></div></div>
<div class="gp"><svg id="sv" viewBox="0 0 1016 640" preserveAspectRatio="xMidYMid meet"><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#56637A"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F16667"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5EEAD4"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FFC454"/></marker></defs><g id="E"></g><g id="N"></g></svg></div></div>
<script>
var N={'A-101':[170,120,'#4C8EDA'],'A-205':[460,120,'#4C8EDA'],'A-318':[460,400,'#4C8EDA'],'A-442':[170,400,'#4C8EDA'],
'B-510':[700,110,'#4C8EDA'],'B-623':[930,270,'#4C8EDA'],'B-777':[700,420,'#4C8EDA'],
'C-901':[330,570,'#4C8EDA'],'C-902':[610,570,'#4C8EDA'],'C-903':[930,560,'#4C8EDA'],'C-904':[60,260,'#4C8EDA']};
var T='TRANSFERRED';
var E=[['A-101','A-205',T,'R50,000 · 09:02'],['A-205','A-318',T,'R48,500 · 09:14'],['A-318','A-442',T,'R47,100 · 09:27'],['A-442','A-101',T,'R45,600 · 09:41'],
['B-510','B-623',T,'R12,000 · 1 Mar'],['B-623','B-777',T,'R3,100 · 9 Mar'],['B-777','B-510',T,'R800 · 28 Mar'],
['C-904','A-101',T,'R1,500 · 2 Mar',.45],['A-205','B-510',T,'R600 · 3 Mar'],['A-318','C-901',T,'R700 · 5 Mar'],['C-901','C-902',T,'R2,300 · 6 Mar'],
['C-902','B-777',T,'R950 · 7 Mar'],['B-623','C-903',T,'R4,000 · 12 Mar']];
var RING=['A-101','A-205','A-318','A-442'],LEGIT=['B-510','B-623','B-777'];
var NS='http://www.w3.org/2000/svg',R=32;
function mk(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
var NE={},EE={},EG=document.getElementById('E'),NG=document.getElementById('N');
function ek(e){return e[0]+'>'+e[1]}
function addEdge(e){var a=N[e[0]],b=N[e[1]],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],L=Math.sqrt(dx*dx+dy*dy),cv=e[5]||0,
cx=mx-dy/L*cv,cy=my+dx/L*cv;function bp(n,tx,ty){var ux=tx-n[0],uy=ty-n[1],l=Math.sqrt(ux*ux+uy*uy);return [n[0]+ux/l*(R+3),n[1]+uy/l*(R+3)]}
var p=bp(a,cx,cy),q=bp(b,cx,cy),g=mk('g',{'class':'e'},EG);g.l=mk('path',{d:'M'+p[0]+' '+p[1]+' Q'+cx+' '+cy+' '+q[0]+' '+q[1],'marker-end':'url(#a0)'},g);
var t=e[4]||.5,lx=(1-t)*(1-t)*p[0]+2*(1-t)*t*cx+t*t*q[0],ly=(1-t)*(1-t)*p[1]+2*(1-t)*t*cy+t*t*q[1],s=e[3]||'',w=Math.max(e[2].length*7.4,s.length*6.8)+16,h=s?34:22;
mk('rect',{x:lx-w/2,y:ly-h/2,width:w,height:h,rx:11},g);var t1=mk('text',{x:lx,y:ly+(s?-2:4),'text-anchor':'middle'},g);t1.textContent=e[2];
if(s){var t2=mk('text',{x:lx,y:ly+12,'text-anchor':'middle','class':'sub'},g);t2.textContent=s}
EE[ek(e)]=g;if(e[6])g.classList.add('hide');return g}
E.forEach(addEdge);
for(var k in N){var d=N[k],g=mk('g',{'class':'n'},NG);mk('circle',{'class':'b',cx:d[0],cy:d[1],r:R,fill:d[2]},g);
var tx=mk('text',{x:d[0],y:d[1]+5,'text-anchor':'middle'},g);tx.textContent=d[3]||k;
var b=mk('g',{'class':'bd'},g);mk('circle',{cx:d[0]+R-4,cy:d[1]-R+4,r:13},b);g.bt=mk('text',{x:d[0]+R-4,y:d[1]-R+9,'text-anchor':'middle'},b);g.b=b;
var tg=mk('g',{'class':'tg'},g);g.tr=mk('rect',{x:d[0]-50,y:d[1]+R+5,width:100,height:22,rx:11},tg);g.tt=mk('text',{x:d[0],y:d[1]+R+21,'text-anchor':'middle'},tg);g.tg=tg;
NE[k]=g;if(d[4])g.classList.add('hide')}
function reset(){for(var k in NE){var g=NE[k];g.classList.remove('hot','hl','amb','dim');g.b.classList.remove('on','ok');g.tg.classList.remove('on','bad')}
for(var k in EE){var e=EE[k];e.classList.remove('hot','hl','amb','dim');e.l.setAttribute('marker-end','url(#a0)')}}
function show(k,v){var o=EE[k]||NE[k];o.classList.toggle('hide',!v)}
function badge(n,txt,ok){var g=NE[n];g.bt.textContent=txt;g.b.classList.add('on');g.b.classList.toggle('ok',!!ok)}
function tag(n,txt,bad){var g=NE[n],w=txt.length*8+16,x=N[n][0];g.tt.textContent=txt;g.tr.setAttribute('width',w);g.tr.setAttribute('x',x-w/2);g.tg.classList.add('on');g.tg.classList.toggle('bad',!!bad)}
var MK={hot:'url(#a1)',hl:'url(#a2)',amb:'url(#a3)'};
function ec(k,c){var e=EE[k];if(!e)return;e.classList.add(c);e.l.setAttribute('marker-end',MK[c])}
function nc(n,c){NE[n].classList.add(c)}
function dimAll(keep){for(var k in NE)if(!keep[k])NE[k].classList.add('dim');for(var k in EE){var p=k.split('>');if(!(keep[p[0]]&&keep[p[1]]))EE[k].classList.add('dim')}}
function cap(q,k,n){var ch=document.getElementById('chip');ch.textContent='STEP '+(k+1)+' / '+n;ch.classList.toggle('bad',!!q.bad);
['t','x','s','c'].forEach(function(id,i){document.getElementById(id).textContent=[q.t,q.x,q.s||'',q.c||''][i]});document.getElementById('s').classList.toggle('bad',!!q.bad);document.getElementById('z').textContent=''}
function setS(v){document.getElementById('s').textContent=v}
var cur=-1,gen=0,manual=false,idle=null;
function later(f,ms){var my=gen;setTimeout(function(){if(my===gen)f()},ms)}
function go(k){gen++;cur=k;var q=S[k],els=['t','x','s','c','z'].map(function(i){return document.getElementById(i)});els.forEach(function(e){e.classList.add('out')});
later(function(){cap(q,k,S.length);reset();q.run();els.forEach(function(e){e.classList.remove('out')});if(!manual)later(function(){go((k+1)%S.length)},q.d||6500)},300)}
function poke(k){manual=true;clearTimeout(idle);go((k+S.length)%S.length);idle=setTimeout(function(){manual=false;go((cur+1)%S.length)},30000)}
document.addEventListener('click',function(){poke(cur+1)});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' ')poke(cur+1);if(e.key==='ArrowLeft')poke(cur-1)});
var st=document.getElementById('st');function fit(){var s=Math.min(innerWidth/1600,innerHeight/640);st.style.transform='translate('+(innerWidth-1600*s)/2+'px,'+(innerHeight-640*s)/2+'px) scale('+s+')'}
addEventListener('resize',fit);fit();
function mkTable(head,rows,topIdx){var z=document.getElementById('z'),tb=document.createElement('table'),h=tb.insertRow();head.forEach(function(s,i){var th=document.createElement('th');th.textContent=s;if(i)th.style.textAlign='right';h.appendChild(th)});
rows.forEach(function(r,i){var tr=tb.insertRow();if(topIdx.indexOf(i)>=0)tr.className='top';r.forEach(function(v,j){var td=tr.insertCell();td.textContent=v;if(j)td.className='n'})});z.appendChild(tb)}
function loop(ids,c){ids.forEach(function(n,i){nc(n,c);ec(n+'>'+ids[(i+1)%ids.length],c)})}
var S=[
{t:'Every transfer passes the rules',x:'Eleven accounts, thirteen transfers. Checked one row at a time, each amount and each account looks ordinary.',s:'13 transfers · 0 alerts',c:'// rules check one transaction at a time',run:function(){},d:6500},
{t:'Ask the graph for loops',x:'A cycle query finds money that leaves an account and comes back to it. Two loops turn up, but a loop alone is not fraud.',s:'2 loops found',c:'MATCH p = (a:Account)\n  -[:TRANSFERRED]->{3,6}(a)\nRETURN p',run:function(){loop(RING,'amb');loop(LEGIT,'amb');setS('2 loops found')},d:7000},
{t:'Add the fraud signature',x:'Keep loops where every hop is later than the last, each amount is at least 90% of the one before, and the whole trip takes under an hour.',s:'',bad:1,c:'WHERE all(i IN range(1, size(t)-1)\n  WHERE t[i].at > t[i-1].at\n  AND t[i].amount >= 0.9 * t[i-1].amount)\nAND t[-1].at < t[0].at\n    + duration("PT1H")',run:function(){var keep={};RING.forEach(function(n){keep[n]=1});dimAll(keep);
RING.forEach(function(n,i){later(function(){nc(n,'hot');badge(n,i+1);ec(n+'>'+RING[(i+1)%4],'hot');if(i===3)setS('1 ring · R50,000 round trip in 39 minutes')},(i+1)*600)})},d:9000},
{t:'Real time: test the closing transfer',x:'A-442 is about to pay A-101. Before it clears, walk from the receiver back to the sender. The cost depends on the size of the neighbourhood, not the size of the bank.',s:'',bad:1,c:'MATCH (:Account {id:$to})\n  (()-[t:TRANSFERRED]->()){2,5}\n  (:Account {id:$from})\nRETURN t   // at payment time',run:function(){show('A-442>A-101',false);
var from='A-442',to='A-101',paths=0,seen={};seen[to]=1;(function walk(n,d){if(d>=5)return;E.forEach(function(e){if(e[0]===n&&!(e[0]===from&&e[1]===to)){paths++;seen[e[1]]=1;if(e[1]!==from)walk(e[1],d+1)}})})(to,0);
nc(to,'hl');nc(from,'hl');later(function(){show('A-442>A-101',true);ec('A-442>A-101','amb')},700);
later(function(){['A-101>A-205','A-205>A-318','A-318>A-442'].forEach(function(k){ec(k,'hot')});RING.forEach(function(n){nc(n,'hot')});ec('A-442>A-101','hot');
setS('Ring caught before it closes · '+paths+' paths checked')},2000)},d:9500}];

go(0);
</script></body></html>
