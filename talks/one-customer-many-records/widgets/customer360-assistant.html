<!doctype html>
<html><head><meta charset="utf-8"><title>Customer 360 Assistant</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#0B1426;color-scheme:dark;overflow:hidden;font-family:"Public Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#EEF2F8}
#st{position:absolute;left:0;top:0;width:1600px;height:640px;transform-origin:0 0;display:flex;gap:24px}
.cap{flex:0 0 640px;box-sizing:border-box;background:#0E1A2F;border:1px solid #24365A;border-radius:18px;padding:24px 28px;display:flex;flex-direction:column;gap:14px}
.hd{display:flex;align-items:center;gap:14px}
.chip{font:600 20px/1 "Fira Code",Consolas,Menlo,monospace;letter-spacing:2px;color:#0B1426;background:#5EEAD4;border-radius:999px;padding:8px 14px;white-space:nowrap}
#t{font-size:26px;font-weight:700}
#chat{flex:1;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.b{max-width:88%;border-radius:16px;padding:12px 16px;font-size:21px;line-height:1.4;animation:in .4s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.user{align-self:flex-end;background:#1E3358;border:1px solid #2E4470}
.user small{display:block;font-size:15px;color:#A9B4C8;margin-bottom:2px;font-family:"Fira Code",Consolas,monospace}
.tool{align-self:flex-start;font:400 17px/1.5 "Fira Code",Consolas,Menlo,monospace;color:#BFCBDD;background:#0B1426;border:1px dashed #2E4470;white-space:pre;max-width:96%}
.bot{align-self:flex-start;background:#102E33;border:1px solid #5EEAD4}
.bot.no{background:#331820;border-color:#F16667}
.cite{display:inline-block;font:600 15px "Fira Code",Consolas,monospace;color:#0B1426;background:#5EEAD4;border-radius:6px;padding:1px 6px;margin:0 2px;vertical-align:2px}
.no .cite{background:#F16667}
.gp{flex:1;position:relative;border-radius:18px;border:1px solid #1B2A47;background:radial-gradient(circle at 50% 45%,#13264A 0%,#0B1426 72%)}
.gp svg{position:absolute;left:0;top:0;width:100%;height:100%}
.n,.e{transition:opacity .45s}
.n{opacity:.14}.e{opacity:.1}
.n.on,.e.on{opacity:1}
.n.on rect,.n.on circle{stroke:#5EEAD4;stroke-width:4}
</style></head>
<body><div id="st">
<div class="cap"><div class="hd"><span class="chip" id="chip">STEP 1 / 7</span><span id="t"></span></div><div id="chat"></div></div>
<div class="gp"><svg id="sv" viewBox="0 0 960 640" preserveAspectRatio="xMidYMid meet">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8A94A6"/></marker></defs>
<g id="E"></g><g id="N"></g></svg></div>
</div>
<script>
var NS='http://www.w3.org/2000/svg';
var N={P:[120,330,'#5EEAD4','Person','PER-1',1],CON:[120,90,'#D8C7AE','Consent','marketing: no'],
CRM:[400,150,'#DA7194','CRM','CRM-001'],WEB:[400,330,'#4C8EDA','Shop','WEB-7781'],SUP:[400,510,'#FFC454','Support','SUP-3302'],
ORD:[645,330,'#56C7E4','Order','ORD-551'],SHO:[862,90,'#8DCC93','Product','Trail Shoes'],P1:[862,250,'#FFC454','Payment','PAY-901 R1,899'],
P2:[862,400,'#FFC454','Payment','PAY-902 R1,899'],REF:[862,560,'#F79767','Refund','REF-77 pending'],TCK:[645,560,'#C990C0','Ticket','TCK-1 exchange'],
PRO:[645,90,'#8DCC93','Promo','GPS Watch offer']};
var E=[['CRM','P','RESOLVES_TO'],['WEB','P','RESOLVES_TO'],['SUP','P','RESOLVES_TO'],['WEB','ORD','PLACED'],['ORD','SHO','CONTAINS'],['P1','ORD','FOR'],['P2','ORD','FOR'],['REF','P2','REFUNDS'],['SUP','TCK','LOGGED'],['TCK','ORD','ABOUT'],['P','CON','HAS_CONSENT'],['P','PRO','OFFER?',1]];
function mk(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
var NE={},EE={},W=160,Hh=58;
function edgePt(a,b){var d=N[a],o=N[b],dx=o[0]-d[0],dy=o[1]-d[1];if(d[5]){var L=Math.sqrt(dx*dx+dy*dy);return [d[0]+dx/L*58,d[1]+dy/L*58]}
var sx=Math.abs(dx)>0?(W/2)/Math.abs(dx):1e9,sy=Math.abs(dy)>0?(Hh/2)/Math.abs(dy):1e9,s=Math.min(sx,sy);return [d[0]+dx*s,d[1]+dy*s]}
E.forEach(function(e){var p=edgePt(e[0],e[1]),q=edgePt(e[1],e[0]),g=mk('g',{'class':'e'},document.getElementById('E'));var l=mk('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:e[3]?'#F16667':'#8A94A6','stroke-width':3,'marker-end':'url(#a)'},g);if(e[3])l.setAttribute('stroke-dasharray','9 8');
var t=e[2]==='RESOLVES_TO'?0.38:0.5,lx=p[0]+(q[0]-p[0])*t,ly=p[1]+(q[1]-p[1])*t,w=e[2].length*8.2+14;mk('rect',{x:lx-w/2,y:ly-12,width:w,height:24,rx:12,fill:'#0E1A2F',stroke:'#2E4470'},g);var tx=mk('text',{x:lx,y:ly+5,'text-anchor':'middle','font-size':13,'font-family':'Fira Code,Consolas,monospace',fill:e[3]?'#F16667':'#F79767'},g);tx.textContent=e[2];EE[e[0]+'-'+e[1]]=g});
for(var k in N){var d=N[k],g=mk('g',{'class':'n'},document.getElementById('N'));
if(d[5])mk('circle',{cx:d[0],cy:d[1],r:58,fill:d[2],stroke:'rgba(0,0,0,.3)','stroke-width':3},g);else mk('rect',{x:d[0]-W/2,y:d[1]-Hh/2,width:W,height:Hh,rx:12,fill:d[2],stroke:'rgba(0,0,0,.3)','stroke-width':3,'stroke-dasharray':k==='PRO'?'8 6':'none'},g);
var a=mk('text',{x:d[0],y:d[1]-6,'text-anchor':'middle','font-size':14,fill:'#0B1426','font-family':'Fira Code,Consolas,monospace'},g);a.textContent=':'+d[3];
var b=mk('text',{x:d[0],y:d[1]+17,'text-anchor':'middle','font-size':17,'font-weight':700,fill:'#0B1426'},g);b.textContent=d[4];NE[k]=g}
var Q1={c:'user',w:'customer · web chat',x:'I was charged twice for my trail running shoes. Is my exchange sorted?'};
var LINK={c:'tool',x:'entity link  →  PER-1 (email match)\nproduct      →  Trail Running Shoes'};
var CY={c:'tool',x:"MATCH (:Person {id:'PER-1'})<-[:RESOLVES_TO]-(c)\n      -[:PLACED]->(o:Order)-[:CONTAINS]->\n      (:Product {name:'Trail Running Shoes'})\nOPTIONAL MATCH (o)<-[:FOR]-(pay:Payment)\nOPTIONAL MATCH (t:Ticket)-[:ABOUT]->(o)\nRETURN o, collect(pay), collect(t)"};
var GOT={c:'tool',x:'retrieved: 1 order · 2 payments · 1 refund · 1 ticket'};
var A1={c:'bot',h:['Yes, you were charged twice for order ',['ORD-551'],' ',['PAY-901'],['PAY-902'],'. A refund of R1,899 is pending ',['REF-77'],', and your size exchange has shipped ',['TCK-1']]};
var Q2={c:'user',w:'staff · marketing assistant',x:'Can we send Thandi a promo for the GPS watch?'};
var CON={c:'tool',x:"MATCH (:Person {id:'PER-1'})-[:HAS_CONSENT]->(k)\nRETURN k.directMarketing   // false"};
var A2={c:'bot',no:1,h:['No. There is no direct-marketing consent on record ',['CONSENT'],'. Offer it only if she opts in.']};
var G={c:'tool',x:'guardrails\n· graph query fails  →  fall back to text search, say so\n· refunds           →  a human approves\n· every claim       →  cites a node ID'};
var ALL=['P','CRM','WEB','SUP','ORD','SHO','P1','P2','REF','TCK'],AE=['CRM-P','WEB-P','SUP-P','WEB-ORD','ORD-SHO','P1-ORD','P2-ORD','REF-P2','SUP-TCK','TCK-ORD'];
var S=[
{t:'A customer asks',b:[Q1],n:[],e:[]},
{t:'Link the entities',b:[Q1,LINK],n:['P','CRM','WEB','SUP'],e:['CRM-P','WEB-P','SUP-P']},
{t:'Write a bounded query',b:[Q1,CY],n:['P','CRM','WEB','SUP'],e:['CRM-P','WEB-P','SUP-P']},
{t:'Retrieve the subgraph',b:[Q1,LINK,GOT],n:ALL,e:AE},
{t:'Answer with citations',b:[Q1,GOT,A1],n:ALL,e:AE},
{t:'Consent is part of the graph',b:[Q2,CON,A2],n:['P','CON','PRO'],e:['P-CON','P-PRO']},
{t:'Guardrails',b:[G,{c:'bot',h:['Grounding reduces hallucination. It does not remove it, so the answer always shows its evidence.']}],n:ALL.concat(['CON']),e:AE.concat(['P-CON'])}];
function bubble(m){var d=document.createElement('div');d.className='b '+m.c+(m.no?' no':'');
if(m.w){var s=document.createElement('small');s.textContent=m.w;d.appendChild(s)}
if(m.h)m.h.forEach(function(p){if(typeof p==='string')d.appendChild(document.createTextNode(p));else{var c=document.createElement('span');c.className='cite';c.textContent=p[0];d.appendChild(c)}});
else d.appendChild(document.createTextNode(m.x));return d}
var cur=-1,gen=0,manual=false,idle=null;
function show(k){gen++;var my=gen;cur=k;var q=S[k];document.getElementById('chip').textContent='STEP '+(k+1)+' / 7';document.getElementById('t').textContent=q.t;
var ch=document.getElementById('chat');ch.textContent='';q.b.forEach(function(m,i){setTimeout(function(){if(my===gen)ch.appendChild(bubble(m))},i*(manual?0:500))});
for(var n in NE)NE[n].classList.toggle('on',q.n.indexOf(n)>-1);for(var e in EE)EE[e].classList.toggle('on',q.e.indexOf(e)>-1);
if(!manual)setTimeout(function(){if(my===gen)show((k+1)%7)},k===2||k===4||k===5?7500:5500)}
function poke(k){manual=true;clearTimeout(idle);show((k+7)%7);idle=setTimeout(function(){manual=false;show((cur+1)%7)},30000)}
document.addEventListener('click',function(){poke(cur+1)});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' ')poke(cur+1);if(e.key==='ArrowLeft')poke(cur-1)});
var st=document.getElementById('st');function fit(){var s=Math.min(innerWidth/1600,innerHeight/640);st.style.transform='translate('+(innerWidth-1600*s)/2+'px,'+(innerHeight-640*s)/2+'px) scale('+s+')'}
addEventListener('resize',fit);fit();show(0);
</script></body></html>
