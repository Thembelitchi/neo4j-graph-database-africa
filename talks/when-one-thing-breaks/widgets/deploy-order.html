<!doctype html>
<html><head><meta charset="utf-8"><title>Deploy Order</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#0B1426;color-scheme:dark;overflow:hidden;font-family:"Public Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#EEF2F8}
#st{position:absolute;left:0;top:0;width:1600px;height:640px;transform-origin:0 0;display:flex;gap:24px}
.cap{flex:0 0 560px;box-sizing:border-box;background:#0E1A2F;border:1px solid #24365A;border-radius:18px;padding:26px 30px;display:flex;flex-direction:column;gap:14px}
.chip{align-self:flex-start;font:600 20px/1 "Fira Code",Consolas,Menlo,monospace;letter-spacing:2px;color:#0B1426;background:#5EEAD4;border-radius:999px;padding:8px 14px}
.chip.bad{background:#F16667}
#t{font-size:29px;font-weight:700;line-height:1.2}
#x{font-size:21px;line-height:1.45;color:#BFCBDD}
#s{font-size:36px;font-weight:800;color:#5EEAD4;line-height:1.1}
#s.bad{color:#F16667}
#c{font:400 18px/1.5 "Fira Code",Consolas,Menlo,monospace;color:#EEF2F8;background:#0B1426;border:1px solid #1E2F50;border-radius:10px;padding:10px 14px;white-space:pre}
#c:empty{display:none}
table{border-collapse:collapse;font-size:19px;width:100%}
th{font:500 15px "Fira Code",Consolas,monospace;color:#A9B4C8;text-align:left;padding:3px 6px;border-bottom:1px solid #24365A}
td{padding:4px 6px;border-bottom:1px solid #1B2A47;font-variant-numeric:tabular-nums}
td.n{text-align:right;font-family:"Fira Code",Consolas,monospace}
tr.top td{color:#5EEAD4;font-weight:700}
.lg{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:16px;color:#A9B4C8}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.fade{transition:opacity .3s}.out{opacity:0}
.gp{flex:1;position:relative;border-radius:18px;border:1px solid #1B2A47;background:radial-gradient(circle at 50% 45%,#13264A 0%,#0B1426 72%)}
.gp svg{position:absolute;left:0;top:0;width:100%;height:100%}
.e line,.e path{stroke:#56637A;stroke-width:2.5;fill:none;transition:stroke .3s}
.e rect{fill:#0E1A2F;stroke:#2E4470}
.e text{fill:#F79767;font-size:13px;font-family:"Fira Code",Consolas,monospace}
.e.hot line,.e.hot path{stroke:#F16667;stroke-width:4}
.e.hl line,.e.hl path{stroke:#5EEAD4;stroke-width:4}
.e.cb path{stroke:#F16667;stroke-dasharray:9 7}
.e,.n{transition:opacity .35s}
.dim{opacity:.22}
.hide{display:none}
.n rect{stroke:rgba(0,0,0,.35);stroke-width:2;transition:stroke .3s,fill .3s}
.n text{font-size:15px;font-weight:700;fill:#0B1426}
.n.imp rect{stroke:#F16667;stroke-width:5}
.n.fail rect{fill:#F16667}
.n.hl rect{stroke:#5EEAD4;stroke-width:5}
.n.stuck rect{stroke:#F16667;stroke-width:4;stroke-dasharray:6 5}
.bd{display:none}.bd.on{display:inline}
.bd circle{fill:#F16667;stroke:#0B1426;stroke-width:2}.bd.ok circle{fill:#5EEAD4}
.bd text{font-size:14px;font-weight:800;fill:#0B1426}
</style></head>
<body><div id="st"><div class="cap"><span class="chip" id="chip">STEP 1</span><div id="t" class="fade"></div><div id="x" class="fade"></div><div id="s" class="fade"></div><div id="c" class="fade"></div><div id="z" class="fade"></div><div class="lg"><span><i style="background:#4C8EDA"></i>Service</span><span><i style="background:#FFC454"></i>Data store</span><span><i style="background:#C990C0"></i>Queue</span><span><i style="background:#8DCC93"></i>Server</span><span><i style="background:#F79767"></i>Network</span></div></div>
<div class="gp"><svg id="sv" viewBox="0 0 1016 640" preserveAspectRatio="xMidYMid meet"><defs>
<marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#56637A"/></marker>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F16667"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5EEAD4"/></marker></defs>
<g id="E"></g><g id="N"></g></svg></div></div>
<script>
var NS='http://www.w3.org/2000/svg',W=150,HH=44,TC={svc:'#4C8EDA',data:'#FFC454',queue:'#C990C0',server:'#8DCC93',net:'#F79767'};
var N={'web-frontend':[330,60,'svc'],'mobile-bff':[700,60,'svc'],checkout:[120,190,'svc'],auth:[400,190,'svc'],catalog:[680,190,'svc'],recs:[935,190,'svc'],
payments:[100,320,'svc'],'orders-db':[300,320,'data'],'session-cache':[520,320,'data'],'catalog-db':[760,320,'data'],'event-bus':[100,450,'queue'],
'node-a':[400,450,'server'],'node-b':[720,450,'server'],'edge-router-04':[260,580,'net'],'dns-internal':[760,580,'net'],'edge-router-05':[510,580,'net']};
var D='DEPENDS_ON',HO='HOSTED_ON';
var E=[['web-frontend','checkout',D],['web-frontend','auth',D,.62],['web-frontend','catalog',D,.33],['mobile-bff','auth',D,.33],['mobile-bff','recs',D],
['checkout','auth',D],['checkout','payments',D,.28],['checkout','orders-db',D],['catalog','auth',D],['catalog','catalog-db',D],['recs','catalog',D],['auth','session-cache',D],['payments','event-bus',D],
['orders-db','node-a',HO],['session-cache','node-b',HO],['catalog-db','node-b',HO],['event-bus','node-a',HO],
['node-a','edge-router-04',D],['node-a','dns-internal',D,.38],['node-b','edge-router-04',D,.66],['node-b','dns-internal',D],
['node-a','edge-router-05',D,.35,'x'],['node-b','edge-router-05',D,0,'x']];
function mk(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
var NE={},EE={},EG=document.getElementById('E'),NG=document.getElementById('N');
function bpt(a,b){var d=N[a],o=N[b],dx=o[0]-d[0],dy=o[1]-d[1],sx=dx?(W/2+3)/Math.abs(dx):1e9,sy=dy?(HH/2+3)/Math.abs(dy):1e9,s=Math.min(sx,sy);return [d[0]+dx*s,d[1]+dy*s]}
function label(g,lx,ly,txt){var w=txt.length*7.8+14;mk('rect',{x:lx-w/2,y:ly-12,width:w,height:24,rx:12},g);var t=mk('text',{x:lx,y:ly+5,'text-anchor':'middle'},g);t.textContent=txt}
function addEdge(e){var p=bpt(e[0],e[1]),q=bpt(e[1],e[0]),g=mk('g',{'class':'e'},EG);g.l=mk('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],'marker-end':'url(#a0)'},g);
if(e[3]!==0){var t=e[3]||.5;label(g,p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t,e[2])}EE[e[0]+'>'+e[1]]=g;if(e[4])g.classList.add('hide');return g}
E.forEach(addEdge);
for(var k in N){var d=N[k],g=mk('g',{'class':'n'},NG);g.r=mk('rect',{x:d[0]-W/2,y:d[1]-HH/2,width:W,height:HH,rx:10,fill:TC[d[2]]},g);
var t=mk('text',{x:d[0],y:d[1]+5,'text-anchor':'middle'},g);t.textContent=k;var b=mk('g',{'class':'bd'},g);mk('circle',{cx:d[0]+W/2-4,cy:d[1]-HH/2+2,r:14},b);g.bt=mk('text',{x:d[0]+W/2-4,y:d[1]-HH/2+7,'text-anchor':'middle'},b);g.b=b;NE[k]=g;if(k==='edge-router-05')g.classList.add('hide')}
function active(){return E.filter(function(e){return !EE[e[0]+'>'+e[1]].classList.contains('hide')})}
function reset(){for(var k in NE){var g=NE[k];g.classList.remove('imp','fail','hl','stuck','dim');g.b.classList.remove('on','ok')}for(var k in EE){var e=EE[k];e.classList.remove('hot','hl','dim');e.l.setAttribute('marker-end','url(#a0)')}}
function badge(n,txt,ok){var g=NE[n];g.bt.textContent=txt;g.b.classList.add('on');g.b.classList.toggle('ok',!!ok)}
function edgeCls(k,c){var e=EE[k];if(!e)return;e.classList.add(c);e.l.setAttribute('marker-end',c==='hot'?'url(#a1)':'url(#a2)')}
function impact(f){var A=active(),F={},hop={};F[f]=1;hop[f]=0;
while(true){var nw={};for(var x in N){if(F[x]||NE[x].classList.contains('hide'))continue;var deps=A.filter(function(e){return e[0]===x}).map(function(e){return e[1]});if(!deps.length)continue;
var groups=[],routers=deps.filter(function(d){return d.indexOf('edge-router')===0});deps.forEach(function(d){if(d.indexOf('edge-router')!==0)groups.push([d])});if(routers.length)groups.push(routers);
groups.forEach(function(g){if(g.every(function(d){return F[d]})){var h=1+Math.max.apply(null,g.map(function(d){return hop[d]}));if(nw[x]===undefined||h<nw[x])nw[x]=h}})}
var ks=Object.keys(nw);if(!ks.length)break;ks.forEach(function(x){F[x]=1;hop[x]=nw[x]})}
return hop}
function cap(q,k,n){var ch=document.getElementById('chip');ch.textContent='STEP '+(k+1)+' / '+n;ch.classList.toggle('bad',!!q.bad);
['t','x','s','c'].forEach(function(id,i){document.getElementById(id).textContent=[q.t,q.x,q.s||'',q.c||''][i]});document.getElementById('s').classList.toggle('bad',!!q.bad)}
var cur=-1,gen=0,manual=false,idle=null;
function later(f,ms){var my=gen;setTimeout(function(){if(my===gen)f()},ms)}
function go(k){gen++;cur=k;var q=S[k],els=['t','x','s','c','z'].map(function(i){return document.getElementById(i)});els.forEach(function(e){e.classList.add('out')});
later(function(){cap(q,k,S.length);reset();q.run();els.forEach(function(e){e.classList.remove('out')});if(!manual)later(function(){go((k+1)%S.length)},q.d||6500)},300)}
function poke(k){manual=true;clearTimeout(idle);go((k+S.length)%S.length);idle=setTimeout(function(){manual=false;go((cur+1)%S.length)},30000)}
document.addEventListener('click',function(){poke(cur+1)});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' ')poke(cur+1);if(e.key==='ArrowLeft')poke(cur-1)});
var st=document.getElementById('st');function fit(){var s=Math.min(innerWidth/1600,innerHeight/640);st.style.transform='translate('+(innerWidth-1600*s)/2+'px,'+(innerHeight-640*s)/2+'px) scale('+s+')'}
addEventListener('resize',fit);fit();
function animImpact(f,cb){var hop=impact(f),mx=0;NE[f].classList.add('fail');for(var n in hop)mx=Math.max(mx,hop[n]);
for(var h=1;h<=mx;h++)(function(h){later(function(){for(var n in hop)if(hop[n]===h){NE[n].classList.add('imp');badge(n,h)}
active().forEach(function(e){if(hop[e[0]]===h&&hop[e[1]]!==undefined&&hop[e[1]]<h)edgeCls(e[0]+'>'+e[1],'hot')});if(h===mx&&cb)cb(Object.keys(hop).length-1)},h*650)})(h);if(!mx&&cb)cb(0);return Object.keys(hop).length-1}
function showR05(v){NE['edge-router-05'].classList.toggle('hide',!v);EE['node-a>edge-router-05'].classList.toggle('hide',!v);EE['node-b>edge-router-05'].classList.toggle('hide',!v)}
function waves(){var A=active(),need={},done={},w={},k=0,left=Object.keys(N).filter(function(n){return !NE[n].classList.contains('hide')});
left.forEach(function(n){need[n]=A.filter(function(e){return e[0]===n}).map(function(e){return e[1]})});
while(true){var ready=left.filter(function(n){return !done[n]&&need[n].every(function(d){return done[d]})});if(!ready.length)break;k++;ready.forEach(function(n){done[n]=1;w[n]=k})}
return {w:w,k:k,stuck:left.filter(function(n){return !done[n]})}}
function animWaves(cb){var r=waves();for(var i=1;i<=r.k;i++)(function(i){later(function(){for(var n in r.w)if(r.w[n]===i){badge(n,i,1);NE[n].classList.add('hl')}if(i===r.k&&cb)cb(r)},i*600)})(i);return r}
var cbE=null;function callback(on){if(!cbE){var p=bpt('payments','checkout'),q=bpt('checkout','payments'),g=mk('g',{'class':'e cb'},EG);var cx=(p[0]+q[0])/2-115,cy=(p[1]+q[1])/2;
g.l=mk('path',{d:'M'+(p[0]-30)+' '+p[1]+' Q'+cx+' '+cy+' '+(q[0]-30)+' '+q[1],'marker-end':'url(#a1)'},g);label(g,cx+62,cy+26,'DEPENDS_ON');g.querySelector('text').setAttribute('fill','#F16667');cbE=g}
cbE.classList.toggle('hide',!on);if(on){E.push(['payments','checkout',D]);EE['payments>checkout']=cbE}else{E=E.filter(function(e){return !(e[0]==='payments'&&e[1]==='checkout')});delete EE['payments>checkout']}}
var S=[
{t:'Start-up order is a graph problem',x:'A component can only start once everything it needs is running. That order is a topological sort, and it only exists if the graph has no cycles.',s:'',c:'// dependencies first, dependents last',run:function(){callback(false)},d:6000},
{t:"Kahn's algorithm, wave by wave",x:'Start with components that need nothing. Each wave starts whatever now has all its dependencies running.',s:'',c:"CALL gds.dag.topologicalSort.stream('deps')",run:function(){callback(false);animWaves(function(r){document.getElementById('s').textContent=r.k+' waves · all 15 started'})},d:7500},
{t:'Add a synchronous callback',x:'A developer makes payments call checkout back, synchronously. One new arrow, and now checkout and payments each wait for the other.',s:'',bad:1,c:'(payments)-[:DEPENDS_ON]->(checkout)',run:function(){callback(true);edgeCls('payments>checkout','hot');edgeCls('checkout>payments','hot')},d:6500},
{t:'The sort gets stuck',x:'Checkout waits for payments, payments waits for checkout, and web-frontend waits for both. The cycle query names the culprits.',s:'',bad:1,c:'MATCH p=(a)-[:DEPENDS_ON]->{1,6}(a)\nRETURN [n IN nodes(p) | n.name]',run:function(){callback(true);animWaves(function(r){r.stuck.forEach(function(n){NE[n].classList.add('stuck')});edgeCls('payments>checkout','hot');edgeCls('checkout>payments','hot');document.getElementById('s').textContent=r.stuck.length+' components never start'})},d:9000},
{t:'Fix it: go asynchronous',x:'Payments publishes a "paid" event to the event bus instead of calling back. The cycle is gone and every component starts again.',s:'',c:'(payments)-[:DEPENDS_ON]->(event-bus)',run:function(){callback(false);edgeCls('payments>event-bus','hl');animWaves(function(r){document.getElementById('s').textContent=r.k+' waves · all 15 started'})},d:7500}];

go(0);
</script></body></html>
